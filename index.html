<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>フィンスト</title>
<meta name="description" content="相手の両手をアウトにしたら勝ち。リンクを開くだけで遊べる2人対戦のブラウザゲームです。">
<meta name="theme-color" content="#0D1522">

<link rel="icon" href="assets/icon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="assets/apple-touch-icon.png">
<link rel="canonical" href="https://finstgame.github.io/">

<!-- LINE などに貼ったときのプレビュー -->
<meta property="og:type" content="website">
<meta property="og:site_name" content="フィンスト">
<meta property="og:title" content="フィンスト">
<meta property="og:description" content="リンクを開くだけで2人対戦。インストール不要のブラウザゲームです。">
<meta property="og:url" content="https://finstgame.github.io/">
<meta property="og:image" content="https://finstgame.github.io/assets/og.jpg">
<meta property="og:image:width" content="1200">
<meta property="og:image:height" content="630">
<meta name="twitter:card" content="summary_large_image">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Dela+Gothic+One&family=Zen+Kaku+Gothic+New:wght@400;700;900&display=swap" rel="stylesheet">

<style>
  :root{
    --ink:#0D1522;
    --panel:#16223A;
    --panel-hi:#1E2E4C;
    --bone:#F5F0E6;
    --dim:#66799A;
    --p0:#33D9BE;
    --p1:#FF5F7E;
    --wood:#E3B778;
    --stick-w: clamp(9px, 2.6vw, 14px);
    --stick-h: clamp(46px, 12vw, 74px);
    --r: 14px;
  }

  *{box-sizing:border-box; margin:0; padding:0; -webkit-tap-highlight-color:transparent;}

  body{
    background:
      radial-gradient(120% 80% at 50% 0%, #17253E 0%, transparent 60%),
      radial-gradient(120% 80% at 50% 100%, #17253E 0%, transparent 60%),
      var(--ink);
    color:var(--bone);
    font-family:"Zen Kaku Gothic New", system-ui, sans-serif;
    min-height:100vh;
    display:flex;
    justify-content:center;
    padding:12px;
  }

  .app{
    width:100%;
    max-width:460px;
    display:flex;
    flex-direction:column;
    gap:10px;
    padding-bottom:var(--sheet-pad, 0px);
  }

  /* ---------- header ---------- */
  .top{
    display:flex;
    align-items:center;
    gap:6px;
    padding:2px 4px;
  }
  .brand{
    font-family:"Dela Gothic One", sans-serif;
    font-size:clamp(20px, 6vw, 26px);
    letter-spacing:.04em;
    white-space:nowrap;
    flex:0 0 auto;
  }
  .brand .dot{color:var(--wood);}
  .phase-tag{
    font-size:11px;
    color:var(--dim);
    letter-spacing:.14em;
  }

  /* ---------- player board ---------- */
  .board{
    background:var(--panel);
    border-radius:var(--r);
    padding:14px 14px 16px;
    border:2px solid transparent;
    transition:border-color .25s, background .25s;
    position:relative;
  }
  .board[data-active="true"]{
    border-color:var(--c);
    background:var(--panel-hi);
  }
  .board[data-dead="true"]{opacity:.5;}

  .board-head{
    display:flex;
    align-items:center;
    gap:8px;
    margin-bottom:12px;
  }
  .pip{
    width:10px; height:10px; border-radius:50%;
    background:var(--c);
    box-shadow:0 0 0 0 var(--c);
  }
  .board[data-active="true"] .pip{animation:pulse 1.8s infinite;}
  @keyframes pulse{
    0%{box-shadow:0 0 0 0 color-mix(in srgb, var(--c) 60%, transparent);}
    70%{box-shadow:0 0 0 9px transparent;}
    100%{box-shadow:0 0 0 0 transparent;}
  }
  .pname{font-weight:900; font-size:14px; letter-spacing:.08em; white-space:nowrap;}
  .ptag{
    margin-left:auto;
    font-size:11px;
    color:var(--dim);
    letter-spacing:.1em;
    white-space:nowrap;
  }
  /* 拡張したプレイヤーの印 */
  .exp{
    font-size:10px;
    font-weight:700;
    letter-spacing:.08em;
    white-space:nowrap;
    flex:0 0 auto;
    color:#0D1522;
    background:var(--wood);
    border-radius:5px;
    padding:2px 6px;
  }

  .hands{display:flex; gap:10px;}

  .hand{
    flex:1;
    background:#0F1A2C;
    border:2px solid #22314E;
    border-radius:12px;
    padding:10px 6px 8px;
    display:flex;
    flex-direction:column;
    align-items:center;
    gap:8px;
    cursor:pointer;
    position:relative;
    transition:transform .18s cubic-bezier(.34,1.56,.64,1), border-color .18s, box-shadow .18s;
  }
  .hand:focus-visible{outline:3px solid var(--wood); outline-offset:2px;}
  .hand[data-out="true"]{cursor:default; border-style:dashed; border-color:#2A3550;}
  .hand.selectable:hover{border-color:var(--c);}
  .hand.selected{
    transform:translateY(-8px);
    border-color:var(--c);
    box-shadow:0 8px 0 -2px color-mix(in srgb, var(--c) 35%, transparent);
  }
  .hand.target{
    border-color:var(--wood);
    animation:beckon 1s ease-in-out infinite;
  }
  @keyframes beckon{
    0%,100%{transform:translateY(0);}
    50%{transform:translateY(-4px);}
  }

  .sticks{
    display:flex;
    gap:5px;
    align-items:flex-end;
    height:var(--stick-h);
  }
  .stick{
    width:var(--stick-w);
    height:var(--stick-h);
    border-radius:calc(var(--stick-w)/2);
    background:linear-gradient(180deg, var(--c) 0%, color-mix(in srgb, var(--c) 62%, #0A1220) 100%);
    box-shadow:inset 0 -3px 0 color-mix(in srgb, #000 22%, transparent);
    transform-origin:bottom center;
    animation:raise .32s cubic-bezier(.34,1.56,.64,1) backwards;
    animation-delay:calc(var(--i) * 45ms);
  }
  @keyframes raise{
    from{transform:scaleY(.1) translateY(6px); opacity:0;}
    to{transform:scaleY(1) translateY(0); opacity:1;}
  }
  .stick.ghost{
    background:none;
    border:1.5px dashed #2A3550;
    box-shadow:none;
    animation:none;
  }
  /* 拡張で増えた5本目のスロット */
  .stick.ghost.bonus{border-color:color-mix(in srgb, var(--wood) 45%, transparent);}
  .stick.broken{
    animation:snap .5s ease-in forwards;
  }
  @keyframes snap{
    0%{transform:rotate(0) translateY(0); opacity:1;}
    30%{transform:rotate(-14deg) translateY(-6px);}
    100%{transform:rotate(70deg) translateY(40px); opacity:0;}
  }

  .count{
    font-family:"Dela Gothic One", sans-serif;
    font-size:22px;
    line-height:1;
    color:var(--c);
  }
  .hand[data-out="true"] .count{color:#3B4A69; font-size:14px; padding:4px 0;}
  .hand-exp{
    font-size:9px; font-weight:700; letter-spacing:.04em;
    color:#0D1522; background:var(--wood);
    border-radius:4px; padding:1px 5px; white-space:nowrap;
  }

  /* lunge */
  .hand.lunge-down{animation:lungeDown .34s ease-in-out;}
  .hand.lunge-up{animation:lungeUp .34s ease-in-out;}
  @keyframes lungeDown{
    0%{transform:translateY(-8px);} 45%{transform:translateY(26px) scale(1.05);} 100%{transform:translateY(0);}
  }
  @keyframes lungeUp{
    0%{transform:translateY(-8px);} 45%{transform:translateY(-34px) scale(1.05);} 100%{transform:translateY(0);}
  }
  .hand.hit{animation:shake .38s;}
  @keyframes shake{
    0%,100%{transform:translateX(0);}
    20%{transform:translateX(-7px);} 40%{transform:translateX(6px);}
    60%{transform:translateX(-4px);} 80%{transform:translateX(3px);}
  }
  .flash{
    position:absolute; inset:0; border-radius:12px;
    background:var(--wood); opacity:0; pointer-events:none;
  }
  .flash.go{animation:flash .38s ease-out;}
  .flash.heal{background:var(--p0);}
  @keyframes flash{from{opacity:.75;} to{opacity:0;}}

  .dmg{
    position:absolute;
    left:50%; top:6px;
    transform:translateX(-50%);
    font-family:"Dela Gothic One", sans-serif;
    font-size:28px;
    color:var(--wood);
    text-shadow:0 2px 0 #0D1522;
    pointer-events:none;
    animation:pop .85s ease-out forwards;
    white-space:nowrap;
  }
  .dmg.up{color:var(--p0);}
  .dmg.nul{color:var(--dim); font-size:19px;}
  @keyframes pop{
    0%{opacity:0; transform:translate(-50%, 8px) scale(.6);}
    25%{opacity:1; transform:translate(-50%, -6px) scale(1.15);}
    100%{opacity:0; transform:translate(-50%, -34px) scale(1);}
  }

  /* ---------- 手札 ---------- */
  .hand-row{
    display:flex;
    gap:7px;
    margin-top:12px;
    align-items:stretch;
  }
  .hand-row[data-empty="true"]{
    font-size:11px;
    color:var(--dim);
    letter-spacing:.1em;
    padding:6px 2px 0;
  }

  .card{
    flex:1 1 0;
    min-width:0;
    background:#0F1A2C;
    border:2px solid #22314E;
    border-radius:10px;
    padding:8px 7px;
    display:flex;
    flex-direction:column;
    gap:3px;
    text-align:left;
    cursor:pointer;
    position:relative;
    overflow:hidden;
    transition:transform .16s cubic-bezier(.34,1.56,.64,1), border-color .16s, box-shadow .16s, opacity .2s;
    animation:deal .34s cubic-bezier(.34,1.56,.64,1) backwards;
    animation-delay:calc(var(--i) * 70ms);
  }
  @keyframes deal{
    from{opacity:0; transform:translateY(14px) rotate(-4deg);}
    to{opacity:1; transform:none;}
  }
  .card:focus-visible{outline:3px solid var(--wood); outline-offset:2px;}
  .card:hover:not(:disabled){border-color:var(--wood);}
  .card.picked{
    transform:translateY(-7px);
    border-color:var(--wood);
    box-shadow:0 7px 0 -2px color-mix(in srgb, var(--wood) 32%, transparent);
  }
  .card:disabled{cursor:default; opacity:.42;}
  .card .cnum{
    font-family:"Dela Gothic One", sans-serif;
    font-size:10px;
    color:var(--dim);
    letter-spacing:.08em;
  }
  .card .cname{
    /* 隕・喚・倍返指などは Dela Gothic One に字が無く合成太字になるため本文書体の900で組む */
    font-weight:900;
    font-size:clamp(11.5px, 3.3vw, 13.5px);
    line-height:1.2;
    letter-spacing:.02em;
    word-break:keep-all;          /* 320px で「カウンター」が語中改行するのを防ぐ */
    color:var(--bone);
  }
  .card .ctiming{
    font-size:9.5px;
    letter-spacing:.06em;
    color:var(--dim);
    margin-top:auto;
  }
  .card[data-timing="defense"] .ctiming{color:var(--wood);}

  /* 使用時に割り箸のように折れて消える */
  .card.spent{animation:spend .42s ease-in forwards;}
  @keyframes spend{
    0%{transform:translateY(-7px) rotate(0); opacity:1;}
    30%{transform:translateY(-12px) rotate(-6deg);}
    100%{transform:translateY(46px) rotate(24deg); opacity:0;}
  }

  /* 相手の手札は裏向き（online 版で見えない情報を先取り） */
  .card.back{
    flex:0 0 34px;
    background:
      repeating-linear-gradient(135deg,
        color-mix(in srgb, var(--wood) 22%, #0F1A2C) 0 6px,
        #0F1A2C 6px 12px);
    border-color:color-mix(in srgb, var(--wood) 30%, #22314E);
    cursor:default;
    align-items:center;
    justify-content:center;
    padding:0;
    height:44px;
  }
  .card.back::after{
    content:"";
    width:14px; height:14px;
    border-left:2px solid color-mix(in srgb, var(--wood) 55%, transparent);
    border-right:2px solid color-mix(in srgb, var(--wood) 55%, transparent);
    transform:rotate(20deg) skewX(-20deg);
  }
  .back-count{
    align-self:center;
    font-size:11px;
    color:var(--dim);
    letter-spacing:.1em;
    margin-left:4px;
  }

  /* ---------- centre: crossed chopsticks turn indicator ---------- */
  .mid{
    display:flex;
    align-items:center;
    gap:12px;
    padding:2px 6px;
  }
  .cross{
    flex:none;
    width:46px; height:46px;
    transition:transform .45s cubic-bezier(.34,1.56,.64,1);
  }
  .cross rect{transition:fill .3s;}
  .log{
    flex:1;
    font-size:13px;
    line-height:1.45;
    color:var(--bone);
    min-height:2.9em;
  }
  .log b{color:var(--turn-c);}
  .log .sub{display:block; color:var(--dim); font-size:11.5px; letter-spacing:.04em;}

  /* ---------- actions ---------- */
  .bar{display:flex; gap:8px;}
  button{
    font-family:inherit;
    font-weight:700;
    font-size:14px;
    color:var(--bone);
    background:var(--panel);
    border:2px solid #22314E;
    border-radius:11px;
    padding:13px 14px;
    cursor:pointer;
    flex:1;
    transition:transform .12s, background .18s, border-color .18s;
  }
  button:hover:not(:disabled){background:var(--panel-hi); border-color:var(--turn-c);}
  button:active:not(:disabled){transform:translateY(2px);}
  button:disabled{opacity:.35; cursor:default;}
  button:focus-visible{outline:3px solid var(--wood); outline-offset:2px;}
  button.primary{background:var(--turn-c); color:#0D1522; border-color:var(--turn-c);}
  button.ghost{flex:0 0 auto; padding:13px 16px; color:var(--dim);}

  /* panels */
  .panel{
    background:var(--panel);
    border:2px solid var(--turn-c);
    border-radius:var(--r);
    padding:12px;
    display:none;
    flex-direction:column;
    gap:10px;
  }
  .panel.open{display:flex; animation:slideIn .25s ease-out;}
  @keyframes slideIn{from{opacity:0; transform:translateY(8px);} to{opacity:1; transform:none;}}
  .panel h3{font-size:12px; letter-spacing:.12em; color:var(--dim); font-weight:700;}
  .opts{display:flex; flex-wrap:wrap; gap:8px;}
  .opt{
    flex:0 0 auto;
    font-family:"Dela Gothic One", sans-serif;
    font-size:17px;
    padding:10px 15px;
    background:#0F1A2C;
    border:2px solid #22314E;
    border-radius:10px;
    line-height:1.15;
  }
  .opt small{
    display:block;
    font-family:"Zen Kaku Gothic New", sans-serif;
    font-size:10px;
    font-weight:700;
    color:var(--dim);
    letter-spacing:.04em;
    margin-top:3px;
  }
  .opt.kill{border-color:var(--wood);}
  .opt.kill small{color:var(--wood);}

  #card.panel{border-color:var(--wood);}
  .card-detail{display:flex; flex-direction:column; gap:5px;}
  .card-detail .dname{
    font-weight:900;
    font-size:19px;
    letter-spacing:.02em;
    color:var(--wood);
  }
  .card-detail .dtext{font-size:13px; line-height:1.5;}
  .card-detail .dnote{font-size:11.5px; line-height:1.5; color:var(--dim);}
  .card-row{display:flex; gap:8px;}
  .card-row .primary{background:var(--wood); color:#0D1522; border-color:var(--wood);}

  /* ステップ中の指示バー */
  .step-bar{
    display:none;
    align-items:center;
    gap:10px;
    background:color-mix(in srgb, var(--wood) 14%, var(--panel));
    border:2px solid var(--wood);
    border-radius:var(--r);
    padding:11px 12px;
    font-size:13px;
    line-height:1.4;
  }
  .step-bar.open{display:flex; animation:slideIn .2s ease-out;}
  .step-bar .sname{font-weight:900; color:var(--wood);}
  .step-bar button{flex:0 0 auto; padding:8px 12px; font-size:12px; color:var(--dim);}

  /* ---------- 応答フェーズ（防御割り込み） ---------- */
  .sheet{
    position:fixed;
    left:0; right:0; bottom:0;
    z-index:20;
    display:none;
    justify-content:center;
    padding:10px 12px calc(12px + env(safe-area-inset-bottom));
    background:linear-gradient(180deg, transparent 0%, rgba(8,13,22,.86) 22%);
  }
  .sheet.open{display:flex; animation:rise .28s cubic-bezier(.34,1.56,.64,1);}
  @keyframes rise{from{opacity:0; transform:translateY(24px);} to{opacity:1; transform:none;}}
  .sheet-inner{
    width:100%;
    max-width:436px;
    background:var(--panel-hi);
    border:2px solid var(--wood);
    border-radius:var(--r);
    padding:12px;
    display:flex;
    flex-direction:column;
    gap:10px;
    box-shadow:0 -10px 40px rgba(8,13,22,.7);
  }
  .sheet-head{display:flex; align-items:baseline; gap:8px;}
  .sheet-head .who{font-weight:900; font-size:14px; color:var(--resp-c);}
  .sheet-head .secs{
    margin-left:auto;
    font-family:"Dela Gothic One", sans-serif;
    font-size:20px;
    color:var(--wood);
  }
  .sheet-head .secs.low{color:var(--p1);}
  .sheet-msg{font-size:13px; line-height:1.45;}
  .sheet-msg b{color:var(--wood);}

  /* 残り時間を割り箸が短くなる形で見せる（§6 の新規演出） */
  .timer{
    height:11px;
    background:#0F1A2C;
    border:1.5px solid #22314E;
    border-radius:6px;
    overflow:hidden;
  }
  .timer-stick{
    height:100%;
    width:100%;
    border-radius:5px;
    background:linear-gradient(90deg,
      color-mix(in srgb, var(--wood) 55%, #0A1220) 0%,
      var(--wood) 100%);
    box-shadow:inset 0 -3px 0 color-mix(in srgb, #000 22%, transparent);
  }
  .timer-stick.low{
    background:linear-gradient(90deg,
      color-mix(in srgb, var(--p1) 55%, #0A1220) 0%,
      var(--p1) 100%);
  }
  /* 応答は判断のための操作なので、横に詰めず2列でタップ領域を大きく取る */
  .sheet .hand-row{
    margin-top:0;
    display:grid;
    grid-template-columns:repeat(2, minmax(0,1fr));
    gap:7px;
  }
  .sheet .card{animation:none; padding:9px 10px;}
  .sheet .card .cname{font-size:14px;}

  /* winner */
  .win{
    position:fixed; inset:0;
    background:rgba(8,13,22,.9);
    display:none;
    align-items:center;
    justify-content:center;
    flex-direction:column;
    gap:18px;
    padding:24px;
    z-index:30;
  }
  .win.open{display:flex; animation:flash-in .4s ease-out;}
  @keyframes flash-in{from{opacity:0;} to{opacity:1;}}
  .win h2{
    font-family:"Dela Gothic One", sans-serif;
    font-size:clamp(30px, 11vw, 46px);
    color:var(--turn-c);
    text-align:center;
    line-height:1.25;
  }
  .win .why{font-size:13px; color:var(--dim); text-align:center; line-height:1.5;}
  /* 縦並びなので、共通の flex:1 で縦に伸びないようにする */
  .win button{flex:0 0 auto; width:100%; max-width:260px;}

  /* ---------- 遊び方 / カード一覧 ---------- */
  .icon-btn{
    flex:0 0 auto;
    width:28px; height:28px;
    padding:0;
    border-radius:50%;
    border:2px solid #22314E;
    background:var(--panel);
    color:var(--dim);
    font-family:"Dela Gothic One", sans-serif;
    font-size:13px;
    line-height:1;
    margin-left:10px;
  }
  .icon-btn:hover{background:var(--panel-hi); border-color:var(--wood); color:var(--bone);}
  .icon-btn[data-off="true"]{opacity:.4; text-decoration:line-through;}
  #soundBtn{margin-left:8px;}

  .info{
    position:fixed; inset:0;
    /* 読み物なので背面は透かさない */
    background:
      radial-gradient(120% 60% at 50% 0%, #17253E 0%, transparent 60%),
      var(--ink);
    display:none;
    justify-content:center;
    z-index:50;
    padding:12px;
    overflow-y:auto;
    overscroll-behavior:contain;
  }
  .info.open{display:flex; animation:flash-in .25s ease-out;}
  .info-inner{width:100%; max-width:460px; padding-bottom:28px;}
  .info-head{
    position:sticky; top:0; z-index:1;
    display:flex; align-items:center;
    padding:12px 2px;
    background:var(--ink);
    box-shadow:0 8px 12px -8px var(--ink);
  }
  .info-title{
    font-family:"Dela Gothic One", sans-serif;
    font-size:20px;
    flex:1;
  }
  .info-body h4{
    font-size:11px; letter-spacing:.14em; color:var(--dim);
    font-weight:700; margin:20px 0 9px;
  }
  .info-body h4:first-child{margin-top:0;}
  .info-body p{font-size:13.5px; line-height:1.7; margin-bottom:9px;}
  .info-body ul{list-style:none; display:flex; flex-direction:column; gap:7px;}
  .info-body li{
    font-size:13px; line-height:1.6;
    padding-left:15px; position:relative;
  }
  .info-body li::before{
    content:""; position:absolute; left:0; top:.62em;
    width:6px; height:2px; border-radius:1px; background:var(--wood);
  }
  .info-body b{color:var(--wood);}
  .info-body .sub2{display:block; color:var(--dim); font-size:11.5px; margin-top:4px;}
  .info-body .em{color:var(--bone); font-weight:700;}

  .lobby-links{display:flex; gap:8px;}
  .seg{display:flex; gap:8px;}
  .seg-btn{

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.58.0/dist/umd/supabase.min.js"></script>
<script>
/* =========================================================
   フィンスト Phase 2（2a 〜 2d）
   Phase 1（素の割り箸ゲーム）の状態管理・演出を継承。
   2a カード基盤 / 2b 自ターンカード / 2c 攻撃カード＋拡張 / 2d 防御割り込み
   ========================================================= */

const NAMES = ["プレイヤー1", "プレイヤー2"];
const HAND_SIZE = 3;
const RESPONSE_MS = 15000;          // 応答フェーズの制限時間（§4）。一度5秒に縮めたが短すぎたため戻した

/* --- カード定義（§3 の一覧）--------------------------------
   timing: self（自ターン）/ attack（自ターン・カード自体が攻撃）/ defense（防御割り込み）
   need  : 使用時に追加入力が要るか（null / "ownHand" / "enemyHand" / "number"）
---------------------------------------------------------- */
const CARDS = {
  1:  {name:"反転",     timing:"self",    text:"相手と指の本数を入れ替える。拡張状態は本人に残る"},
  2:  {name:"シールド", timing:"defense", text:"受けるダメージが1になる"},
  3:  {name:"隕石",     timing:"self",    text:"相手の生きている手に好きな数字を足す。防御割り込みでは防げない"},
  4:  {name:"召喚",     timing:"self",    text:"片方が0の時、そこに1本〜自分の上限までの好きな数字を生み出す"},
  5:  {name:"拡張",     timing:"self",    text:"自分の片手を選ぶ。その手だけ5本まで持てるようになり、アウトになる数が6に変わる（永久）"},
  6:  {name:"倍返指",   timing:"attack",  text:"このカード自体が攻撃を実行する。ダメージ2倍"},
  7:  {name:"カウンター",timing:"defense",text:"攻撃を無効化し、攻撃してきた手にそのまま返す。重ねがけ可"},
  8:  {name:"ダブル",   timing:"attack",  text:"両手それぞれで1回ずつ攻撃する。同じ手を2回は狙えない"},
  9:  {name:"ヒール",   timing:"defense", text:"無効化した上で、任意の自分の手にダメージ分を追加（超過分は切り捨て／アウトの手も復活できる）"},
  10: {name:"コピー",   timing:"self",    text:"自分の両手を相手と同じ本数にする。カードはコピーしない"},
};
const TIMING_LABEL = {self:"自ターン", attack:"攻撃", defense:"防御割り込み"};

let S, busy = false, timerId = null;

/* =========================================================
   Phase 3 — オンライン対戦（Supabase Realtime）
   仕様書 §5 のとおり、サーバー側の審判は置かず、行動したクライアントが
   state 全体を書き込み、相手はそれを購読して適用する。
   ========================================================= */
const NET = {
  url: "https://cxdooucxduldzvpyvnwt.supabase.co",
  /* publishable キーはクライアントに埋め込む前提の公開鍵。secret キーは絶対に置かない */
  key: "sb_publishable_OVBScuO-et_n0xCJmU7EGg_uGx13NWE"
};
/* 紛らわしい文字（I L O 0 1）を除いた6文字 */
const CODE_ALPHABET = "ABCDEFGHJKMNPQRSTUVWXYZ23456789";
/* 同期する項目。sel / pick / step は各自の手元の操作なので送らない */
const SYNC = ["hands","max","outAt","expanded","mode","cards","used","turn","phase","pending","over","winner","why","msg","hit","seq"];

/* アウトの条件。部屋を作った側が決め、相手はそれを受け取る。
   quick … その数以上でアウト（手が落ちやすく、決着が早い）
   deep  … その数ちょうどでアウト。超えたぶんは割った余りに繰り下がる（粘れて読み合いが深い） */
const MODES = {
  quick: { name:"クイック", rule:"以上でアウト" },
  deep:  { name:"ディープ", rule:"ちょうどでアウト" }
};
let ruleMode = "quick";
try{ if(MODES[localStorage.getItem("finst_mode")]) ruleMode = localStorage.getItem("finst_mode"); }catch(e){}
function setMode(m){
  if(!MODES[m]) return;
  ruleMode = m;
  try{ localStorage.setItem("finst_mode", m); }catch(e){}
  SFX.tap();
  showLobby();
}

let sb = null;        // supabase client
let online = false;
let seat = 0;         // 自分の席（0 = 部屋を作った側 / 1 = 参加した側）
let room = null;      // ルームコード
let chan = null;      // realtime channel
let myId = null;      // 匿名ID（リロードしても同じ席に戻るため）
let applying = false; // 受信適用中は書き戻さない
let watchdog = null;  // 応答側が落ちたときの保険

function clientId(){
  let v = null;
  try{ v = localStorage.getItem("finst_id"); }catch(e){}
  if(!v){
    v = (crypto.randomUUID ? crypto.randomUUID()
        : "xxxxxxxx-xxxx-4xxx-yxxx-xxxxxxxxxxxx".replace(/[xy]/g, c => {
            const r = Math.random()*16|0; return (c === "x" ? r : (r&0x3|0x8)).toString(16); }));
    try{ localStorage.setItem("finst_id", v); }catch(e){}
  }
  return v;
}

function newCode(){
  let s = "";
  for(let i=0;i<6;i++) s += CODE_ALPHABET[Math.floor(Math.random()*CODE_ALPHABET.length)];
  return s;
}

/* 対戦の初期状態。部屋を作った側だけが作り、相手はこれを受け取る */
function newState(){
  return {
    hands: [[1,1],[1,1]],
    max:   [[4,4],[4,4]],                // 手ごとの上限。拡張した手だけ 5
    mode:  ruleMode,                     // quick | deep
    outAt: [[5,5],[5,5]],                // 手ごとのアウトの基準。拡張した手だけ 6
    expanded: [[false,false],[false,false]],  // 拡張したのはどの手か
    cards: [deal(), deal()],
    used:  [[],[]],
    turn: Math.random() < 0.5 ? 0 : 1,   // 先攻はランダム
    phase: "normal",                     // normal | defense | resolving | finished
    pending: null,
    over: false,
    winner: null,
    why: "",
    msg: "",
    hit: null,                          // 直前の着弾。受信側が突き出し演出を再現するのに使う
    seq: 0
  };
}

function snapshot(){ const o = {}; SYNC.forEach(k => o[k] = S[k]); return o; }

function openingMsg(){
  return `<b>${NAMES[S.turn]}</b>の先攻ではじまります。`
    + `<span class="sub">${modeName()}モード（${outDesc(0, 0)}）／カードは3枚ずつ。自分の手を選んで相手の手をタップ</span>`;
}

/* 状態が確定した所（手番交代・応答フェーズ開始・決着）で呼ぶ */
function commit(){
  if(!online || applying || !room || !sb) return Promise.resolve();
  S.seq = (S.seq || 0) + 1;
  const snap = snapshot();
  return sb.from("matches")
    .update({ state: snap,
              deadline: S.pending && S.pending.deadline ? new Date(S.pending.deadline).toISOString() : null })
    .eq("room_code", room)
    .then(res => { if(res && res.error) netStatus(false, res.error.message); });
}

function applyRemote(snap){
  if(!snap) return;
  if(S && (snap.seq || 0) <= (S.seq || 0)) return;   // 自分の書き込みの反射・古い更新は捨てる
  applying = true;
  const before = JSON.parse(JSON.stringify(S.hands));
  SYNC.forEach(k => S[k] = snap[k]);
  S.sel = null; S.pick = null; S.step = null;
  busy = false;
  stopTimer(); clearTimeout(watchdog);
  closeAllPanels();
  render();
  say(S.msg || openingMsg());
  animateDiff(before);
  notifyTurn();
  renderGone();
  if(S.over){ showWin(); }
  else if(S.phase === "defense" && S.pending){
    if(S.pending.responder === seat){
      /* 攻撃の書き込みが届くまでの往復（実測 約1秒）で猶予が削られるので、
         受け取った側は自分に届いた時点から数え直す。
         攻撃側は state の締切＋余裕で見張るので、早すぎる自動パスにはならない。 */
      const left = S.pending.deadline - Date.now();
      if(left < RESPONSE_MS) S.pending.deadline = Date.now() + RESPONSE_MS;
      openSheet();
    } else startWatchdog();
  }
  applying = false;
}

/* 受信側は途中経過を持たないので、state の hit と手の増減から演出を組み立てる */
async function animateDiff(before){
  const hit = S.hit;
  if(hit && hit.p !== null && hit.p !== undefined){
    const atk = document.querySelector(`.hand[data-p="${hit.p}"][data-h="${hit.h}"]`);
    if(atk){
      atk.classList.add(hit.p === bottomP() ? "lunge-up" : "lunge-down");
      await wait(190);
    }
  }
  if(hit){
    const el = document.querySelector(`.hand[data-p="${hit.dp}"][data-h="${hit.dh}"]`);
    if(el){
      const tag = document.createElement("div");
      tag.className = "dmg";
      tag.textContent = "+" + hit.dmg;
      el.appendChild(tag);
    }
    buzz(hit.out ? [18,60,28] : 18);
    if(hit.out) SFX.out(); else SFX.hit();
  }
  [0,1].forEach(p => [0,1].forEach(h => {
    const b = before[p][h], a = S.hands[p][h];
    if(b === a) return;
    const el = document.querySelector(`.hand[data-p="${p}"][data-h="${h}"]`);
    if(!el) return;
    if(a === 0){
      el.querySelector(".flash").classList.add("go");
      el.classList.add("hit");
      el.querySelectorAll(".stick:not(.ghost)").forEach((s,i) => {
        s.style.animationDelay = (i*40)+"ms"; s.classList.add("broken");
      });
    } else {
      const f = el.querySelector(".flash");
      if(a > b) f.classList.add("heal");
      f.classList.add("go");
    }
  }));
}

/* 応答側の端末が落ちた場合に、攻撃側の端末が肩代わりする。
   応答側は受信時点から数え直すので、その往復ぶんを見込んで余裕を持たせる。 */
function startWatchdog(){
  clearTimeout(watchdog);
  const ms = Math.max(600, (S.pending.deadline - Date.now()) + 3000);
  watchdog = setTimeout(() => {
    if(online && S.phase === "defense" && S.pending && S.pending.responder !== seat) passDefense(true);
  }, ms);
}

/* ---- 相手が居るかどうか（Presence）----
   タブを閉じられた・電池が切れた場合、state は何も変わらないので
   「考えています」のまま永久に待つことになる。それを防ぐ。 */
let oppHere = true, oppGoneAt = 0, goneTimer = null;

function readPresence(){
  if(!online || !chan) return;
  let here = false;
  try{
    const st = chan.presenceState() || {};
    here = Object.keys(st).some(k => k !== String(seat));
  }catch(e){ return; }

  if(here){
    oppHere = true; oppGoneAt = 0;
    clearTimeout(goneTimer);
    renderGone();
  } else if(oppHere){
    /* 一瞬の切れ替わりで慌てない。数秒たっても戻らなければ知らせる */
    oppHere = false;
    oppGoneAt = Date.now();
    clearTimeout(goneTimer);
    goneTimer = setTimeout(renderGone, 4000);
  }
}

function renderGone(){
  const bar = document.getElementById("goneBar");
  if(!bar) return;
  const show = online && !oppHere && !S.over &&
               !document.getElementById("lobby").classList.contains("open");
  if(!show){ bar.classList.remove("open"); return; }
  bar.innerHTML = `<span>${NAMES[foe(seat)]}の接続が切れています</span>
    <button class="ghost" onclick="claimWin()">自分の勝ちにして終わる</button>`;
  bar.classList.add("open");
}

/* 相手が戻らないとき、待ち続けずに終われるようにする */
function claimWin(){
  if(!online || S.over) return;
  stopTimer(); clearTimeout(watchdog);
  S.over = true; S.phase = "finished";
  S.winner = seat;
  S.why = `${NAMES[foe(seat)]}の接続が切れたため`;
  S.msg = `<b>${NAMES[seat]}</b>の勝ち。<span class="sub">${S.why}</span>`;
  S.pending = null; S.step = null; S.hit = null;
  render(); showWin(); say(S.msg);
  commit();
}

/* ---- 自分の番になったことに気づけるように ---- */
const BASE_TITLE = document.title;
let wasMine = false;

function notifyTurn(){
  if(!online){ return; }
  if(S.over){ wasMine = false; document.title = BASE_TITLE; return; }
  const mine = S.phase === "defense"
    ? !!(S.pending && S.pending.responder === seat)
    : S.turn === seat;
  if(mine && !wasMine){
    /* 応答は5秒しかないので、はっきり知らせる */
    buzz(S.phase === "defense" ? [30,70,30] : 25);
    SFX.turn();
    if(document.visibilityState !== "visible") document.title = "(!) " + BASE_TITLE;
  }
  if(!mine || document.visibilityState === "visible") document.title = BASE_TITLE;
  wasMine = mine;
}

function netStatus(ok, why){
  const el = document.getElementById("netTag");
  if(!online){ el.textContent = "1台で対戦"; el.removeAttribute("data-on"); return; }
  el.dataset.on = String(!!ok);
  el.textContent = ok ? room : (why ? "接続に問題 ／ " + why : "接続に問題");
  el.title = ok ? `オンライン ${room}` : (why || "接続に問題");
}

/* スマホは画面を消すと WebSocket が切れる。復帰時・回線復帰時・購読が落ちた時に
   必ずサーバの現在値を取り直す。取りこぼしを黙って抱えたまま遊び続けるのが一番まずい。 */
async function resync(why){
  if(!online || !room || !sb) return;
  const { data, error } = await sb.from("matches").select("state").eq("room_code", room).maybeSingle();
  if(error){ netStatus(false, error.message); return; }
  netStatus(true);
  if(data && data.state) applyRemote(data.state);
  if(why === "wake" && chan && chan.state !== "joined") reconnect();
}

/* 購読ごと張り直す */
async function reconnect(){
  if(!online || !room) return;
  try{ if(chan) sb.removeChannel(chan); }catch(e){}
  chan = null;
  await connect(room);
  await resync("reconnect");
}

let pollId = null;
function startNetWatch(){
  clearInterval(pollId);
  /* 見えている間だけ、20秒ごとの保険。Realtime が生きていれば seq で弾かれるだけで実質無害 */
  pollId = setInterval(() => { if(document.visibilityState === "visible") resync("poll"); }, 20000);
}

document.addEventListener("visibilitychange", () => {
  if(document.visibilityState === "visible"){ document.title = BASE_TITLE; resync("wake"); }
});
window.addEventListener("online",  () => resync("wake"));
window.addEventListener("offline", () => netStatus(false, "オフライン"));

async function connect(code){
  room = code;
  chan = sb.channel("finst:" + code, { config:{ presence:{ key: String(seat) } } })
    .on("presence", { event:"sync" },  readPresence)
    .on("presence", { event:"join" },  readPresence)
    .on("presence", { event:"leave" }, readPresence)
    .on("postgres_changes",
        { event:"UPDATE", schema:"public", table:"matches", filter:"room_code=eq." + code },
        payload => applyRemote(payload.new && payload.new.state))
    .on("postgres_changes",
        { event:"UPDATE", schema:"public", table:"rooms", filter:"code=eq." + code },
        payload => { if(payload.new && payload.new.status === "playing") enterGame(); });
  await chan.subscribe(st => {
    netStatus(st === "SUBSCRIBED");
    if(st === "SUBSCRIBED") chan.track({ seat, at: Date.now() });
    /* 購読が落ちたら黙って諦めず、次に見えたときに張り直す */
    if(st === "CHANNEL_ERROR" || st === "TIMED_OUT") setTimeout(() => resync("wake"), 1500);
  });
  startNetWatch();
}

/* 古い部屋を落とす。cron を用意せずに済むよう、部屋を作るついでに掃除する。
   容量が逼迫するわけではないが、放っておくと誰も片付けない。 */
function purgeOldRooms(){
  const cutoff = new Date(Date.now() - 2 * 24 * 60 * 60 * 1000).toISOString();
  try{ sb.from("rooms").delete().lt("created_at", cutoff).then(() => {}, () => {}); }catch(e){}
}

async function createRoom(){
  lobbyError("");
  purgeOldRooms();

  const st = newState();
  /* 6文字は約8億9千万通りなので当たらないが、当たったときに黙って落ちないようにする */
  let code = null;
  for(let i = 0; i < 5; i++){
    const c = newCode();
    const { error } = await sb.from("rooms").insert({ code: c, status:"waiting", host_id: myId });
    if(!error){ code = c; break; }
    if(!/duplicate key|already exists/i.test(error.message || "")) return lobbyError(explain(error));
  }
  if(!code) return lobbyError("部屋を作れませんでした。もう一度お試しください");

  const { error: e2 } = await sb.from("matches").insert({ room_code: code, state: st });
  if(e2) return lobbyError(explain(e2));

  online = true; seat = 0;
  S = Object.assign({}, st, {sel:null, pick:null, step:null});
  await connect(code);
  location.hash = code;
  showLobby("waiting");
}

async function joinRoom(code){
  lobbyError("");
  code = (code || "").trim().toUpperCase();
  if(code.length !== 6) return lobbyError("ルームコードは6文字です");

  const { data: r, error: e1 } = await sb.from("rooms").select("*").eq("code", code).maybeSingle();
  if(e1) return lobbyError(explain(e1));
  if(!r)  return lobbyError("その部屋は見つかりません。コードを確認してください");

  /* 同じ端末で開き直したときは、元の席に戻る */
  let mySeat = r.host_id === myId ? 0 : r.guest_id === myId ? 1 : null;
  if(mySeat === null){
    if(r.guest_id) return lobbyError("その部屋はもう2人います");
    const { error: e2 } = await sb.from("rooms")
      .update({ guest_id: myId, status:"playing" }).eq("code", code).is("guest_id", null);
    if(e2) return lobbyError(explain(e2));
    mySeat = 1;
  }

  const { data: m, error: e3 } = await sb.from("matches").select("state").eq("room_code", code).maybeSingle();
  if(e3) return lobbyError(explain(e3));
  if(!m)  return lobbyError("対戦データが見つかりません");

  online = true; seat = mySeat;
  S = Object.assign({}, m.state, {sel:null, pick:null, step:null});
  await connect(code);
  location.hash = code;
  enterGame();
  /* 参加した側が入ったことを相手に知らせる（rooms の更新だけでは初期表示が動かないため） */
  if(seat === 1) commit();
}

function explain(e){
  const m = (e && e.message) || String(e);
  if(/relation .* does not exist|schema cache/i.test(m))
    return "テーブルがまだありません。Supabase の SQL Editor で schema.sql を実行してください";
  if(/row-level security|permission denied/i.test(m))
    return "RLS で弾かれました。schema.sql のポリシーが適用されているか確認してください";
  return m;
}

function startOffline(){
  online = false; seat = 0; room = null;

/* 10種からランダムに3枚。プレイヤーごとに独立して引くので両者が同じカードを持ちうる */
function deal(){
  const pool = Object.keys(CARDS).map(Number);
  for(let i = pool.length - 1; i > 0; i--){
    const j = Math.floor(Math.random() * (i + 1));
    [pool[i], pool[j]] = [pool[j], pool[i]];
  }
  return pool.slice(0, HAND_SIZE).sort((a,b) => a - b);
}

const alive = (p,h) => S.hands[p][h] > 0;
const dead  = p => S.hands[p][0] === 0 && S.hands[p][1] === 0;
const col   = p => p === 0 ? "var(--p0)" : "var(--p1)";
const hn    = h => h === 0 ? "左" : "右";
const foe   = p => 1 - p;
const wait  = ms => new Promise(r => setTimeout(r, ms));

function say(html){ document.getElementById("log").innerHTML = html; }

/* 手応え。対応していない端末では何も起きない */
function buzz(ms){
  if(window.matchMedia("(prefers-reduced-motion: reduce)").matches) return;
  try{ navigator.vibrate && navigator.vibrate(ms); }catch(e){}
}

/* ================= 効果音 =================
   音声ファイルは持たず、その場で合成する。割り箸を叩く音が芯。
   ブラウザの制限で最初の操作までは鳴らせないので、初回のタップで起こす。 */
const SFX = (() => {
  let ctx = null, noise = null;
  let on = true;
  try{ on = localStorage.getItem("finst_sound") !== "off"; }catch(e){}

  function ac(){
    if(!ctx){
      const C = window.AudioContext || window.webkitAudioContext;
      if(!C) return null;
      try{ ctx = new C(); }catch(e){ return null; }
    }
    if(ctx.state === "suspended") ctx.resume();
    return ctx;
  }
  function noiseBuf(){
    if(noise) return noise;
    const n = Math.floor(ctx.sampleRate * 0.25);
    noise = ctx.createBuffer(1, n, ctx.sampleRate);
    const d = noise.getChannelData(0);
    for(let i=0;i<n;i++) d[i] = Math.random()*2 - 1;
    return noise;
  }
  /* 減衰する包絡線をつないで鳴らす */
  function play(src, at, attack, decay, peak, dest){
    const g = ctx.createGain();
    g.gain.setValueAtTime(0.0001, at);
    g.gain.exponentialRampToValueAtTime(peak, at + attack);
    g.gain.exponentialRampToValueAtTime(0.0001, at + attack + decay);
    src.connect(g); g.connect(dest || ctx.destination);
    src.start(at); src.stop(at + attack + decay + 0.02);
  }
  function tone(freq, at, dur, peak, type){
    const o = ctx.createOscillator();
    o.type = type || "sine";
    o.frequency.setValueAtTime(freq, at);
    play(o, at, 0.005, dur, peak);
  }
  /* 木を叩いた音：帯域を絞ったノイズ＋低い正弦 */
  function knock(freq, at, dur, peak){
    const s = ctx.createBufferSource(); s.buffer = noiseBuf();
    const bp = ctx.createBiquadFilter();
    bp.type = "bandpass"; bp.frequency.setValueAtTime(freq * 5, at); bp.Q.value = 1.4;
    const g = ctx.createGain();
    g.gain.setValueAtTime(0.0001, at);
    g.gain.exponentialRampToValueAtTime(peak, at + 0.004);
    g.gain.exponentialRampToValueAtTime(0.0001, at + dur);
    s.connect(bp); bp.connect(g); g.connect(ctx.destination);
    s.start(at); s.stop(at + dur + 0.02);
    tone(freq, at, dur * 0.9, peak * 0.7);
  }

  const api = {
    get enabled(){ return on; },
    toggle(){
      on = !on;
      try{ localStorage.setItem("finst_sound", on ? "on" : "off"); }catch(e){}
      if(on){ api.wake(); api.tap(); }
      return on;
    },
    wake(){ if(on) ac(); },

    tap(){   if(!on || !ac()) return; knock(320, ctx.currentTime, 0.05, 0.16); },
    card(){  if(!on || !ac()) return;
             const t = ctx.currentTime;
             const s = ctx.createBufferSource(); s.buffer = noiseBuf();
             const hp = ctx.createBiquadFilter(); hp.type = "highpass"; hp.frequency.value = 900;
             const g = ctx.createGain();
             g.gain.setValueAtTime(0.0001, t);
             g.gain.exponentialRampToValueAtTime(0.12, t + 0.02);
             g.gain.exponentialRampToValueAtTime(0.0001, t + 0.16);
             s.connect(hp); hp.connect(g); g.connect(ctx.destination);
             s.start(t); s.stop(t + 0.2); },
    hit(){   if(!on || !ac()) return; knock(190, ctx.currentTime, 0.10, 0.30); },
    /* アウト：折れて落ちるので、続けて2回、下がりながら */
    out(){   if(!on || !ac()) return;
             const t = ctx.currentTime;
             knock(210, t, 0.09, 0.30);
             knock(140, t + 0.075, 0.16, 0.26);
             tone(90, t + 0.09, 0.28, 0.10, "triangle"); },
    heal(){  if(!on || !ac()) return;
             const t = ctx.currentTime;
             tone(520, t, 0.12, 0.10); tone(780, t + 0.07, 0.16, 0.09); },
    turn(){  if(!on || !ac()) return;
             const t = ctx.currentTime;
             tone(660, t, 0.11, 0.12); tone(880, t + 0.10, 0.18, 0.11); },
    /* 応答フェーズの残り2秒 */
    tick(){  if(!on || !ac()) return; tone(1250, ctx.currentTime, 0.05, 0.06, "square"); },
    win(){   if(!on || !ac()) return;
             const t = ctx.currentTime;
             [523, 659, 784, 1046].forEach((f,i) => tone(f, t + i*0.09, 0.22, 0.11)); },
    lose(){  if(!on || !ac()) return;
             const t = ctx.currentTime;
             [392, 330, 262].forEach((f,i) => tone(f, t + i*0.11, 0.28, 0.10, "triangle")); }
  };
  return api;
})();

/* 最初の操作で音を起こす（ブラウザの自動再生制限） */
document.addEventListener("pointerdown", () => SFX.wake(), { once:true });

function toggleSound(){
  const el = document.getElementById("soundBtn");
  const on = SFX.toggle();
  el.textContent = on ? "♪" : "♪";
  el.dataset.off = String(!on);
  el.setAttribute("aria-label", on ? "音を消す" : "音を出す");
}

/* 受け取る側の基準で判定する。0 になった手はアウト。 */
const norm = (v, p, h) => S.mode === "deep"
  ? ((v % S.outAt[p][h]) + S.outAt[p][h]) % S.outAt[p][h]   // ちょうどでアウト、超えたら繰り下がる
  : (v >= S.outAt[p][h] ? 0 : v);                           // その数以上でアウト

/* 画面に出す言い方（例: 「5以上でアウト」「5ちょうどでアウト」）*/
const outDesc = (p, h) => S.outAt[p][h] + (S.mode === "deep" ? "ちょうどでアウト" : "以上でアウト");
const modeName = () => (MODES[S.mode] || MODES.quick).name;

/* ================= 描画 ================= */
/* 自分の盤が下。オンラインでは席によって上下が入れ替わる */
const bottomP = () => online ? seat : 0;

function render(){
  document.documentElement.style.setProperty("--turn-c", col(S.turn));
  document.getElementById("cross").querySelectorAll("rect")
    .forEach(r => r.setAttribute("fill", col(S.turn)));
  document.getElementById("cross").style.transform =
    S.turn === bottomP() ? "rotate(0deg)" : "rotate(180deg)";

  const bot = bottomP();
  document.getElementById("board" + foe(bot)).style.order = 2;
  document.getElementById("board" + bot).style.order = 4;

  [0,1].forEach(p => {
    const el = document.getElementById("board"+p);
    el.style.setProperty("--c", col(p));
    el.dataset.active = String(S.turn === p && !S.over);
    el.dataset.dead = String(dead(p));
    el.dataset.mine = String(online && p === seat);
    el.innerHTML = `
      <div class="board-head">
        <span class="pip"></span>
        <span class="pname">${NAMES[p]}</span>
        ${S.expanded[p].some(Boolean) ? `<span class="exp">拡張ずみ</span>` : ""}
        <span class="ptag">${S.turn === p && !S.over ? "手番" : ""}</span>
      </div>
      <div class="hands">${[0,1].map(h => handHTML(p,h)).join("")}</div>
      ${cardsHTML(p)}`;
  });

  document.querySelectorAll(".hand").forEach(el => {
    el.onclick = () => tap(+el.dataset.p, +el.dataset.h);
    el.onkeydown = e => { if(e.key === "Enter" || e.key === " "){ e.preventDefault(); tap(+el.dataset.p, +el.dataset.h); } };
  });
  document.querySelectorAll('.board .card[data-id]').forEach(el => {
    el.onclick = () => pickCard(+el.dataset.id);
  });

  document.getElementById("splitBtn").disabled =
    S.over || S.phase !== "normal" || !!S.step || !myTurn() || splitOptions().length === 0;
  document.getElementById("resetBtn").textContent = online ? "もう一戦" : "最初から";

  /* 相手の番のあいだは、待っていることを言葉で出す */
  const wb = document.getElementById("waitBar");
  if(online && !S.over && !myTurn() && S.phase === "normal"){
    wb.classList.add("open");
    wb.innerHTML = `<span class="dots">${NAMES[foe(seat)]}が考えています</span>`;
  } else if(online && !S.over && S.phase === "defense" && !iRespond()){
    wb.classList.add("open");
    wb.innerHTML = `<span class="dots">${NAMES[foe(seat)]}の応答を待っています</span>`;
  } else {
    wb.classList.remove("open");
  }
}

/* この手が今クリックできるか（通常攻撃の的か、カードの入力対象か） */
function isTargetable(p,h){
  if(S.over || busy || !alive(p,h)) return false;
  if(S.step){
    if(S.step.need === "ownHand")   return p === S.step.who;
    if(S.step.need === "enemyHand") return p === foe(S.step.who);
    return false;
  }
  if(S.phase !== "normal" || !myTurn()) return false;
  return !!S.sel && p !== S.turn;
}

function handHTML(p,h){
  const v = S.hands[p][h];
  const out = v === 0;
  const isMine = p === S.turn && myTurn() && !S.over && S.phase === "normal" && !S.step;
  const selected = S.sel && S.sel[0] === p && S.sel[1] === h;
  const target = isTargetable(p,h);
  /* ヒールはアウトの手も選べるので、生存判定と別に扱う */
  const healable = S.step && S.step.need === "ownHand" && (S.step.healTarget || S.step.expandTarget) && p === S.step.who;

  let cls = "hand";
  if(isMine && !out) cls += " selectable";
  if(selected) cls += " selected";
  if(target || healable) cls += " target";

  const sticks = Array.from({length: S.max[p][h]}, (_,i) =>
    `<div class="stick${i < v ? "" : " ghost"}${i >= 4 ? " bonus" : ""}" style="--i:${i}"></div>`).join("");

  const clickable = (isMine && !out) || target || healable;
  return `<div class="${cls}" data-p="${p}" data-h="${h}" data-out="${out}"
            tabindex="${clickable ? 0 : -1}"
            role="button" aria-label="${NAMES[p]}の${hn(h)}手 ${out?"アウト":v+"本"}（${outDesc(p,h)}）">
            <div class="flash"></div>
            <div class="sticks">${sticks}</div>
            <div class="count">${out ? "OUT" : v}</div>
            ${S.expanded[p][h] ? `<div class="hand-exp">${S.outAt[p][h]}でアウト</div>` : ""}
          </div>`;
}

/* 相手の手札は枚数だけ見せる（何を持っているかは隠す）。
   オンラインでは「自分の席の手札」を常に表向きにする（応答フェーズで使うため）。 */
function cardsHTML(p){
  const hand = S.cards[p];
  if(hand.length === 0){
    return `<div class="hand-row" data-empty="true">手札なし</div>`;
  }

  const faceUp = online ? p === seat : (p === S.turn && !S.over);
  if(!faceUp){
    return `<div class="hand-row" aria-label="${NAMES[p]}の手札 ${hand.length}枚">
      ${hand.map(() => `<div class="card back" aria-hidden="true"></div>`).join("")}
      <span class="back-count">手札 ${hand.length}</span>
    </div>`;
  }
  return `<div class="hand-row">${hand.map((id,i) => cardBtnHTML(id, i, p)).join("")}</div>`;
}

function cardBtnHTML(id, i, p){
  const c = CARDS[id];
  const u = usable(id, p);
  return `<button class="card${S.pick === id ? " picked" : ""}" data-id="${id}" data-timing="${c.timing}"
            style="--i:${i}" ${u.ok ? "" : "disabled"}
            aria-label="${c.name}：${c.text}${u.ok ? "" : "（今は使えません：" + u.why + "）"}">
            <span class="cnum">${String(id).padStart(2,"0")}</span>
            <span class="cname">${c.name}</span>
            <span class="ctiming">${u.ok ? TIMING_LABEL[c.timing] : u.why}</span>
          </button>`;
}

/* 自ターンにそのカードを切れるか */
function usable(id, p){
  const c = CARDS[id];
  if(c.timing === "defense") return {ok:false, why:"防御割り込み"};
  if(online && (p !== seat || S.turn !== seat)) return {ok:false, why:"相手の番"};
  if(S.phase !== "normal" || S.step) return {ok:false, why:TIMING_LABEL[c.timing]};
  if(id === 4 && !S.hands[p].includes(0)) return {ok:false, why:"0の手が無い"};
  return {ok:true, why:""};
}

/* ================= 通常行動 ================= */
function tap(p,h){
  if(busy || S.over) return;

  /* カードの入力待ち中は、その入力として解釈する */
  if(S.step){
    const st = S.step;
    if(st.need === "ownHand" && p === st.who && (st.healTarget || st.expandTarget || alive(p,h))) return stepGotHand(p,h);
    if(st.need === "enemyHand" && p === foe(st.who) && alive(p,h)) return stepGotHand(p,h);
    return;
  }

  if(S.phase !== "normal" || !myTurn()) return;

  if(p === S.turn){
    if(!alive(p,h)) return;
    S.sel = (S.sel && S.sel[1] === h) ? null : [p,h];
    if(S.sel) SFX.tap();
    closeAllPanels();
    render();
    if(S.sel) say(`<b>${NAMES[p]}</b>が${hn(h)}手（${S.hands[p][h]}本）をかまえた。<span class="sub">相手の手をタップして攻撃</span>`);
    return;
  }

  if(!S.sel){
    say(`まず自分の手を選んでください。<span class="sub">手番は <b>${NAMES[S.turn]}</b></span>`);
    return;
  }
  if(!alive(p,h)) return;

  const from = S.sel;
  S.sel = null;
  declareAttack({
    from: from[0], fromHand: from[1],
    to: p, toHand: h,
    damage: S.hands[from[0]][from[1]],
    kind: "touch"
  });
}

/* ================= 攻撃と応答フェーズ（§4） ================= */
function declareAttack(atk){
  if(S.pending) return;                // 解決中の攻撃を上書きしない
  S.hit = null;
  S.pending = Object.assign({modifiers:[], chain:0}, atk);
  enterDefense();
}

/* 防御側が防御カードを持っているか？
   持っていなければ応答フェーズを挟まず即解決する。ここでポーズを入れると
   「持っていない」ことが相手に漏れるので、必ず無言でスキップする（§4）。 */
function enterDefense(){
  const p = S.pending;
  p.responder = p.to;
  const hasDefense = S.cards[p.to].some(id => CARDS[id].timing === "defense");
  if(!hasDefense){ resolvePending(); return; }

  S.phase = "defense";
  p.deadline = Date.now() + RESPONSE_MS;
  S.msg = `<b>${NAMES[p.from]}</b>の攻撃に <b>${NAMES[p.to]}</b> が応答できます。`
    + `<span class="sub">15秒以内に防御カードを使うか、受ける。無反応なら自動でパス</span>`;
  render();
  say(S.msg);
  commit();                                  // 相手の端末に応答フェーズと締切を渡す
  if(iRespond()) openSheet(); else startWatchdog();
}

function openSheet(){
  const p = S.pending;
  const r = p.responder;
  document.documentElement.style.setProperty("--resp-c", col(r));
  document.getElementById("sheetWho").textContent = `${NAMES[r]}の応答`;
  document.getElementById("sheetMsg").innerHTML = attackDesc(p);
  renderSheetBody();
  document.getElementById("sheet").classList.add("open");
  document.documentElement.style.setProperty("--sheet-pad", "230px");
  startTimer();
}

function attackDesc(p){
  const via = p.kind === "touch" ? "タッチ"
            : p.kind === "double" ? "「ダブル」"
            : p.kind === "counter" ? "「カウンター」の返し"
            : "「倍返指」";
  const before = S.hands[p.to][p.toHand];
  const after = norm(before + p.damage, p.to, p.toHand);
  const fate = after === 0 ? "アウト" : `${after}本`;
  return `${NAMES[p.from]}の${via}。<b>${p.damage}ダメージ</b>が${NAMES[p.to]}の${hn(p.toHand)}手へ。
    <span class="sub">このまま通ると ${before} + ${p.damage} = ${before + p.damage} → ${fate}（${outDesc(p.to, p.toHand)}）</span>`;
}

function renderSheetBody(){
  const p = S.pending, r = p.responder;
  const defs = S.cards[r].filter(id => CARDS[id].timing === "defense");
  document.getElementById("sheetBody").innerHTML = `
    <div class="hand-row">
      ${defs.map((id,i) => `<button class="card" data-def="${id}" data-timing="defense" style="--i:${i}"
          aria-label="${CARDS[id].name}：${CARDS[id].text}">
          <span class="cnum">${String(id).padStart(2,"0")}</span>
          <span class="cname">${CARDS[id].name}</span>
          <span class="ctiming">使う</span>
        </button>`).join("")}
      <button class="card" data-def="pass" style="--i:${defs.length}" aria-label="何もせず受ける">
        <span class="cnum">—</span><span class="cname">受ける</span><span class="ctiming">パス</span>
      </button>
    </div>`;
  document.querySelectorAll('#sheetBody .card[data-def]').forEach(el => {
    el.onclick = () => {
      const v = el.dataset.def;
      if(v === "pass") passDefense(); else respond(+v);
    };
  });
}

function closeSheet(){
  document.getElementById("sheet").classList.remove("open");
  document.documentElement.style.setProperty("--sheet-pad", "0px");
  stopTimer();
}

/* タイマーは deadline（絶対時刻）を基準に描画する。
   Phase 3 では deadline を Supabase 側に持たせ、ここは表示だけにする。 */
function startTimer(){
  stopTimer();
  const stick = document.getElementById("timerStick");
  const secs = document.getElementById("sheetSecs");
  let lastSec = null;
  const tick = () => {
    if(!S.pending || S.phase !== "defense") return stopTimer();
    const left = S.pending.deadline - Date.now();
    const pct = Math.max(0, Math.min(1, left / RESPONSE_MS));
    stick.style.width = (pct * 100).toFixed(2) + "%";
    const s = Math.max(0, Math.ceil(left / 1000));
    secs.textContent = s + "秒";
    stick.classList.toggle("low", s <= 5);
    secs.classList.toggle("low", s <= 5);
    if(s !== lastSec){ lastSec = s; if(s <= 2 && s > 0) SFX.tick(); }
    if(left <= 0){ stopTimer(); passDefense(true); }
  };
  tick();
  timerId = setInterval(tick, 100);
}
function stopTimer(){ if(timerId){ clearInterval(timerId); timerId = null; } }

function passDefense(timedOut){
  if(S.phase !== "defense") return;
  /* 応答権があるのは防御側だけ。ただし相手の端末が落ちたときは攻撃側が締切+3秒で肩代わりする */
  if(online && !iRespond() && !timedOut) return;
  stopTimer();
  closeSheet();
  S.pending.passNote = timedOut ? "無反応で自動パス" : "受ける選択";
  resolvePending();
}

/* 防御カードで応答する */
function respond(id){
  if(S.phase !== "defense" || !iRespond()) return;
  const p = S.pending, r = p.responder;
  stopTimer();                                   // カードを切った時点で時間切れの対象外にする

  if(id === 2){                                  // シールド：ダメージが1になる
    consume(r, 2);
    p.damage = 1;
    p.modifiers.push("shield");
    closeSheet();
    p.passNote = `${NAMES[r]}のシールドでダメージが1に`;
    resolvePending();
    return;
  }

  if(id === 9){                                  // ヒール：無効化して自分の手に足す
    consume(r, 9);
    closeSheet();
    S.phase = "resolving";
    beginStep({id:9, who:r, need:"ownHand", healTarget:true, amount:p.damage,
               text:`<span class="sname">ヒール</span> 無効化しました。${p.damage}本を足す自分の手を選んでください（アウトの手も復活できます）`});
    return;
  }

  if(id === 7){                                  // カウンター：無効化して、攻撃してきた手に返す
    consume(r, 7);
    closeSheet();
    S.phase = "resolving";
    /* 返し先は攻撃してきた手。選ばせると、迷っているあいだに攻撃側の
       ウォッチドッグが先に発火してカウンターが上書きされる事故が起きる。 */
    let toHand = p.fromHand;
    if(toHand === null || toHand === undefined || !alive(foe(r), toHand)){
      toHand = [0,1].find(h => alive(foe(r), h));   // 攻撃元が特定できないときは生きている手へ
    }
    if(toHand === undefined){ resolvePending(); return; }   // 返す先が無ければそのまま通す
    const orig = p;
    S.pending = {
      from: r, fromHand: null,
      to: foe(r), toHand,
      damage: orig.damage,
      kind: "counter",
      modifiers: orig.modifiers.concat("counter"),
      chain: (orig.chain || 0) + 1
    };
    poof(orig.to, orig.toHand, "無効", "nul").then(() => {
      S.msg = `<b>${NAMES[r]}</b>がカウンター。<span class="sub">${orig.damage}ダメージを ${NAMES[foe(r)]}の${hn(toHand)}手へ返した</span>`;
      say(S.msg);
      enterDefense();      // 返された側もシールド／ヒール／カウンターで応答できる
    });
    return;
  }
}

/* 攻撃を実際に適用して手番を終える */
async function resolvePending(){
  const p = S.pending;
  if(!p) return;                       // 二重解決を防ぐ
  S.phase = "resolving";
  busy = true;
  closeSheet();
  render();

  const src = p.fromHand === null || p.fromHand === undefined ? null : {p:p.from, h:p.fromHand};
  const before = S.hands[p.to][p.toHand];
  const after = norm(before + p.damage, p.to, p.toHand);
  /* 相手の端末でも突き出し→着弾を再現できるように残す */
  S.hit = {p: src ? src.p : null, h: src ? src.h : null,
           dp: p.to, dh: p.toHand, dmg: p.damage, out: after === 0};
  await strike(src, p.to, p.toHand, p.damage, after);

  const via = p.kind === "counter" ? "カウンターで返された攻撃" :
              p.kind === "double"  ? "「ダブル」" :
              p.kind === "twice"   ? "「倍返指」" : `${p.damage}本`;
  const head = after === 0
    ? `<b>${NAMES[p.from]}</b>の${via}が刺さり、${NAMES[p.to]}の${hn(p.toHand)}手が<b>アウト</b>。`
    : `<b>${NAMES[p.from]}</b>の${via}が入った。`;
  const calc = `<span class="sub">${before} + ${p.damage} = ${before + p.damage}`
    + (after === 0 ? `（${outDesc(p.to, p.toHand)}）`
       : (S.mode === "deep" && before + p.damage >= S.outAt[p.to][p.toHand] ? ` → 繰り下がって ${after}本` : `本`))
    + (p.passNote ? ` ／ ${p.passNote}` : "") + `</span>`;

  S.pending = null;
  if(checkDeath()) return;

  /* ダブルの2回目。手番はまだ渡さない */
  if(S.doubleQueue && S.doubleQueue.length){
    const nx = S.doubleQueue.shift();
    const attacker = p.from;
    if(S.hands[attacker][nx.mine] > 0 && S.hands[foe(attacker)][nx.theirs] > 0){
      say(head + calc + `<span class="sub">ダブルの2回目</span>`);
      busy = false;
      declareAttack({from:attacker, fromHand:nx.mine, to:foe(attacker), toHand:nx.theirs,
                     damage:S.hands[attacker][nx.mine], kind:"double"});
      return;
    }
  }
  S.doubleQueue = null;
  endTurn(head + calc);
}

/* 突き出す→着弾→折れる、の一連（Phase 1 の演出をそのまま使う） */
async function strike(src, dp, dh, dmg, after){
  const defEl = document.querySelector(`.hand[data-p="${dp}"][data-h="${dh}"]`);
  if(src){
    const atkEl = document.querySelector(`.hand[data-p="${src.p}"][data-h="${src.h}"]`);
    if(atkEl){
      atkEl.classList.add(src.p === 0 ? "lunge-up" : "lunge-down");
      await wait(190);
    }
  }
  if(!defEl){ S.hands[dp][dh] = after; return; }

  defEl.querySelector(".flash").classList.add("go");
  defEl.classList.add("hit");
  const tag = document.createElement("div");
  tag.className = "dmg";
  tag.textContent = "+" + dmg;
  defEl.appendChild(tag);
  buzz(after === 0 ? [18,60,28] : 18);
  if(after === 0) SFX.out(); else SFX.hit();

  S.hands[dp][dh] = after;

  if(after === 0){
    defEl.querySelectorAll(".stick:not(.ghost)").forEach((s,i) => {
      s.style.animationDelay = (i*40)+"ms";
      s.classList.add("broken");
    });
    await wait(520);
  } else {
    await wait(420);
  }
}

/* 数値がその場で変わるカード用の軽い演出 */
async function poof(p, h, label, kind){
  const el = document.querySelector(`.hand[data-p="${p}"][data-h="${h}"]`);
  if(!el) return;
  const f = el.querySelector(".flash");
  if(kind === "heal"){ f.classList.add("heal"); SFX.heal(); }
  f.classList.add("go");
  const tag = document.createElement("div");
  tag.className = "dmg " + (kind === "heal" ? "up" : kind === "nul" ? "nul" : "");
  tag.textContent = label;
  el.appendChild(tag);
  await wait(430);
}

/* ================= カード ================= */
function pickCard(id){
  if(busy || S.over || S.phase !== "normal" || S.step || !myTurn()) return;
  if(!S.cards[S.turn].includes(id)) return;
  if(!usable(id, S.turn).ok) return;

  if(S.pick === id){ closeCard(); return; }

  S.sel = null;
  S.pick = id;
  closeSplit();
  render();

  const c = CARDS[id];
  document.getElementById("cardDetail").innerHTML = `
    <div class="dname">${c.name}</div>
    <div class="dtext">${c.text}</div>
    <div class="dnote">${TIMING_LABEL[c.timing]} ／ 1回だけ使えます。使うと手札から消えます（補充なし）</div>`;
  document.getElementById("cardUse").onclick = () => useCard(id);
  const panel = document.getElementById("card");
  panel.classList.add("open");
  panel.scrollIntoView({block:"nearest", behavior:"smooth"});
  say(`<b>${NAMES[S.turn]}</b>が「${c.name}」を選んだ。<span class="sub">使えば手札から消えます</span>`);
}

function closeCard(){
  S.pick = null;
  document.getElementById("card").classList.remove("open");
}

/* 追加入力が要るカードはここで分岐する。
   カードの消費は「効果が確定した瞬間」に行うので、途中でやめても失われない。 */
function useCard(id){
  if(busy || S.over || S.phase !== "normal") return;
  const me = S.turn;
  S.hit = null;
  closeCard();

  switch(id){
    case 1:  return runReverse(me);
    case 10: return runCopy(me);
    case 5:  return beginStep({id:5, who:me, need:"ownHand", expandTarget:true,
                text:`<span class="sname">拡張</span> どちらの手を強くしますか？`});
    case 3:  return beginStep({id:3, who:me, need:"enemyHand",
                text:`<span class="sname">隕石</span> どの手に落としますか？`});
    case 4:  return beginStep({id:4, who:me, need:"number",
                text:`<span class="sname">召喚</span> 生み出す本数を選んでください`});
    case 6:  return beginStep({id:6, who:me, need:"ownHand",
                text:`<span class="sname">倍返指</span> 攻撃する自分の手を選んでください`});
    case 8:  {
      const live = [0,1].filter(h => S.hands[me][h] > 0);
      if(!live.length) return;
      return beginStep({id:8, who:me, need:"enemyHand", data:{mine:live, hits:[]},
                text:`<span class="sname">ダブル</span> ${hn(live[0])}手（${S.hands[me][live[0]]}本）でどの手を狙いますか？`});
    }
  }
}

function consume(p, id){
  S.cards[p] = S.cards[p].filter(x => x !== id);
  S.used[p].push(id);
}

/* 消費のアニメーションを挟んでから消す */
async function spend(p, id){
  const el = document.querySelector(`.board .card[data-id="${id}"]`);
  SFX.card();
  if(el && p === S.turn){ el.classList.add("spent"); await wait(340); }
  consume(p, id);
}

/* ---- 入力ステップ ---- */
function beginStep(step){
  S.step = Object.assign({data:{}}, step);
  render();
  const bar = document.getElementById("stepBar");
  document.getElementById("stepText").innerHTML = step.text;
  bar.classList.add("open");
  bar.scrollIntoView({block:"nearest", behavior:"smooth"});
  if(step.need === "number") openNumbers();
}

function cancelStep(){
  const st = S.step;
  S.step = null;
  closeStepUI();
  /* 応答フェーズ由来のステップ（カウンター／ヒール）は取り消せない。
     カードは既に消費済みなので、やめる＝そのまま受けるに倒す。 */
  if(st && st.id === 9){ S.pending.passNote = "ヒールの回復先を選ばず終了"; return resolvePending(); }
  S.phase = "normal";
  render();
  say(`やめました。<span class="sub">手番は <b>${NAMES[S.turn]}</b></span>`);
}

function closeStepUI(){
  document.getElementById("stepBar").classList.remove("open");
  document.getElementById("num").classList.remove("open");
}

function stepGotHand(p,h){
  const st = S.step;

  if(st.id === 5){                       // 拡張：強くする手を選んだ
    S.step = null; closeStepUI();
    return runExpand(st.who, h);
  }

  if(st.id === 3){                       // 隕石：手を決めたら数を選ぶ
    st.data.target = [p,h];
    st.need = "number";
    document.getElementById("stepText").innerHTML =
      `<span class="sname">隕石</span> ${NAMES[p]}の${hn(h)}手（${S.hands[p][h]}本）に足す数を選んでください`;
    render();
    openNumbers();
    return;
  }

  if(st.id === 6){                       // 倍返指：自分の手 → 相手の手
    if(st.need === "ownHand"){
      st.data.mine = h;
      st.need = "enemyHand";
      document.getElementById("stepText").innerHTML =
        `<span class="sname">倍返指</span> ${S.hands[p][h]}本 × 2 = <b>${S.hands[p][h]*2}ダメージ</b>。どの手を狙いますか？`;
      render();
      return;
    }
    const me = st.who, dmg = S.hands[me][st.data.mine] * 2;
    S.step = null; closeStepUI();
    busy = true;                       // 消費アニメ中に次の操作を受け付けない
    spend(me, 6).then(() => {
      busy = false;
      render();
      declareAttack({from:me, fromHand:st.data.mine, to:p, toHand:h, damage:dmg, kind:"twice"});
    });
    return;
  }

  if(st.id === 8){                       // ダブル：両手それぞれで1回ずつ。同じ手は狙えない
    const me = st.who;
    st.data.hits.push({mine: st.data.mine[st.data.hits.length], theirs: h});

    /* まだ攻撃していない自分の手があり、狙える相手の手が残っていれば続ける */
    const nextMine = st.data.mine[st.data.hits.length];
    const used = st.data.hits.map(x => x.theirs);
    const remain = [0,1].filter(x => S.hands[foe(me)][x] > 0 && !used.includes(x));
    if(nextMine !== undefined && remain.length){
      document.getElementById("stepText").innerHTML =
        `<span class="sname">ダブル</span> つぎは${hn(nextMine)}手（${S.hands[me][nextMine]}本）。残りの手を狙ってください`;
      render();
      return;
    }

    const hits = st.data.hits;
    S.step = null; closeStepUI();
    busy = true;
    spend(me, 8).then(async () => {
      busy = false;
      render();
      /* 1回目を通常の攻撃として宣言し、2回目は解決後に続ける */
      S.doubleQueue = hits.slice(1);
      declareAttack({from:me, fromHand:hits[0].mine, to:foe(me), toHand:hits[0].theirs,
                     damage:S.hands[me][hits[0].mine], kind:"double"});
    });
    return;
  }

  if(st.id === 9){                       // ヒール：回復先を選んだ
    const me = st.who, amt = st.amount;
    const before = S.hands[me][h];
    const after = Math.min(before + amt, S.max[me][h]);   // その手の上限を超える分は切り捨て
    S.step = null; closeStepUI();
    S.hands[me][h] = after;
    const orig = S.pending;
    S.pending = null;
    poof(orig.to, orig.toHand, "無効", "nul")
      .then(() => { render(); return poof(me, h, "+" + (after - before), "heal"); })
      .then(() => {
        render();
        if(checkDeath()) return;
        endTurn(`<b>${NAMES[me]}</b>のヒール。${NAMES[orig.from]}の攻撃を無効化した。`
          + `<span class="sub">${hn(h)}手 ${before} → ${after}本`
          + (before + amt > S.max[me][h] ? `（上限${S.max[me][h]}で切り捨て）` : "") + `</span>`);
      });
    return;
  }
}

function openNumbers(){
  const st = S.step;
  const box = document.getElementById("numOpts");
  const title = document.getElementById("numTitle");
  box.innerHTML = "";

  let choices = [];
  if(st.id === 3){
    const [tp, th] = st.data.target;
    const before = S.hands[tp][th];
    title.textContent = `足す数を選ぶ（${NAMES[tp]}の${hn(th)}手・${outDesc(tp, th)}）`;
    if(S.mode === "deep"){
      /* 繰り下がるので、基準以上の数は必ずどれかと同じ結果になる。
         重複を出さないよう 1〜基準-1 だけ並べ、結果を添える。 */
      for(let n = 1; n < S.outAt[tp][th]; n++){
        const after = norm(before + n, tp, th);
        choices.push({n, label:`+${n}`, note: after === 0 ? "アウト" : `${after}本`, kill: after === 0});
      }
    } else {
      /* 届いた時点で結果は同じなので、生き残る数だけ並べ、最後に「アウト」を1つ置く */
      for(let n = 1; before + n < S.outAt[tp][th]; n++){
        choices.push({n, label:`+${n}`, note:`${before + n}本`, kill:false});
      }
      choices.push({n: S.outAt[tp][th] - before, label:"アウト", note:"落とす", kill:true});
    }
  } else if(st.id === 4){
    const sh = S.hands[st.who].indexOf(0);
    const cap = S.max[st.who][sh];
    title.textContent = `生み出す本数を選ぶ（${hn(sh)}手・上限${cap}）`;
    for(let n = 1; n <= cap; n++) choices.push({n, label:String(n), note:`${n}本`, kill:false});
  }

  choices.forEach(c => {
    const b = document.createElement("button");
    b.className = "opt" + (c.kill ? " kill" : "");
    b.innerHTML = `${c.label}<small>${c.note}</small>`;
    b.onclick = () => stepGotNumber(c.n);
    box.appendChild(b);
  });
  const panel = document.getElementById("num");
  panel.classList.add("open");
  panel.scrollIntoView({block:"nearest", behavior:"smooth"});
}

function stepGotNumber(n){
  const st = S.step;

  if(st.id === 3){                       // 隕石：防御割り込みの対象外なので即解決
    const [tp, th] = st.data.target;
    const me = st.who;
    S.step = null; closeStepUI();
    busy = true;
    spend(me, 3).then(() => {
      render();
      const before = S.hands[tp][th];
      const after = norm(before + n, tp, th);
      return strike(null, tp, th, n, after).then(() => {
        render();
        if(checkDeath()) return;
        endTurn(`<b>${NAMES[me]}</b>の隕石が ${NAMES[tp]}の${hn(th)}手を直撃。`
          + `<span class="sub">${before} + ${n} = ${before + n} → ${after === 0 ? "アウト" : after + "本"}（${outDesc(tp, th)}・防御不可）</span>`);
      });
    });
    return;
  }

  if(st.id === 4){                       // 召喚：0の手に生み出す
    const me = st.who;
    const h = S.hands[me].indexOf(0);
    S.step = null; closeStepUI();
    busy = true;
    spend(me, 4).then(() => {
      S.hands[me][h] = n;
      render();
      return poof(me, h, "+" + n, "heal");
    }).then(() => {
      render();
      endTurn(`<b>${NAMES[me]}</b>が${hn(h)}手に${n}本を召喚した。<span class="sub">アウトの手が復活</span>`);
    });
    return;
  }
}

/* ---- 追加入力の要らないカード ---- */
async function runReverse(me){
  busy = true;
  await spend(me, 1);
  const a = S.hands[0].slice(), b = S.hands[1].slice();
  /* 指の本数だけ入れ替える。拡張（上限・法）は本人に残るので、
     受け取った本数は受け取る側の法で正規化される（§3 の想定内コンボ）。 */
  S.hands[0] = b.map((v,h) => norm(v, 0, h));
  S.hands[1] = a.map((v,h) => norm(v, 1, h));
  render();
  await poof(0, 0, "反転", "nul");
  render();
  if(checkDeath(me)) return;
  endTurn(`<b>${NAMES[me]}</b>が反転。<span class="sub">${a.join("/")} ⇄ ${b.join("/")} → ${S.hands[0].join("/")} ／ ${S.hands[1].join("/")}（拡張は本人に残る）</span>`);
}

async function runCopy(me){
  busy = true;
  await spend(me, 10);
  const opp = foe(me);
  const src = S.hands[opp].slice();
  S.hands[me] = src.map((v,h) => norm(v, me, h));   // その手の基準を超える本数を受け取ると即アウト
  render();
  await poof(me, 0, "コピー", "nul");
  render();
  if(checkDeath(me)) return;
  endTurn(`<b>${NAMES[me]}</b>がコピー。<span class="sub">${NAMES[opp]}の ${src.join("/")} を写して ${S.hands[me].join("/")}（カードはコピーしない）</span>`);
}

async function runExpand(me, h){
  busy = true;
  await spend(me, 5);
  S.max[me][h] = 5;
  S.outAt[me][h] = 6;
  S.expanded[me][h] = true;
  render();
  await poof(me, h, "拡張", "heal");
  render();
  endTurn(`<b>${NAMES[me]}</b>が${hn(h)}手を拡張。<span class="sub">その手だけ5本まで持てるようになり、${outDesc(me, h)}に変わった（永久）</span>`);
}

/* ================= 分配 ================= */
function splitOptions(){
  if(!S) return [];
  const [L,R] = S.hands[S.turn];
  const total = L + R;
  const maxL = S.max[S.turn][0], maxR = S.max[S.turn][1];
  const out = [];
  for(let a = 0; a <= maxL; a++){
    const b = total - a;
    if(b < 0 || b > maxR) continue;
    if(a === L && b === R) continue;   // 同じ配分に戻すだけの手は禁止
    if(a === R && b === L) continue;   // 左右を入れ替えるだけも禁止
    if(a === 0 && b === 0) continue;
    out.push([a,b]);
  }
  return out;
}

function openSplit(){
  if(busy || S.over || S.phase !== "normal" || S.step || !myTurn()) return;
  S.sel = null;
  closeCard();
  render();
  const box = document.getElementById("opts");
  box.innerHTML = "";
  splitOptions().forEach(([a,b]) => {
    const btn = document.createElement("button");
    btn.className = "opt";
    btn.innerHTML = `${a} <span style="color:var(--dim)">/</span> ${b}`;
    btn.onclick = () => applySplit(a,b);
    box.appendChild(btn);
  });
  document.getElementById("split").classList.add("open");
  say(`<b>${NAMES[S.turn]}</b>が指を組み替える。<span class="sub">左 / 右 の分けかたを選ぶ</span>`);
}

function closeSplit(){ document.getElementById("split").classList.remove("open"); }

function applySplit(a,b){
  S.hit = null;
  const from = S.hands[S.turn].join("/");
  S.hands[S.turn] = [a,b];
  closeSplit();
  endTurn(`指を組み替えた。<span class="sub">${from} → ${a}/${b}</span>`);
}

/* ================= 進行 ================= */
function closeAllPanels(){
  closeSplit(); closeCard(); closeStepUI(); closeSheet();
}

function endTurn(msg){
  S.doubleQueue = null;
  /* 保険：どの経路から来ても、両手アウトのプレイヤーが居るまま手番を回さない */
  if(dead(0) || dead(1)){ S.pending = null; S.step = null; checkDeath(); return; }
  S.sel = null;
  S.pick = null;
  S.step = null;
  S.pending = null;
  S.phase = "normal";
  S.turn = foe(S.turn);
  S.msg = msg + `<span class="sub">次は ${NAMES[S.turn]}</span>`;
  closeAllPanels();
  stopTimer(); clearTimeout(watchdog);
  render();
  say(S.msg);
  busy = false;
  commit();
}

/* 両手ともアウトなら負け。自分のカードで自滅した場合も同じ扱い。 */
function checkDeath(actor){
  const d0 = dead(0), d1 = dead(1);
  if(!d0 && !d1) return false;
  /* 同時に両者が落ちることは本来起きないが、起きた場合は行動した側の負けにする */
  if(d0 && d1) finish(actor === 0 ? 1 : 0, "両者が同時に落ちたため、行動した側の負け");
  else finish(d0 ? 1 : 0, "両手ともアウトで決着");
  return true;
}

function finish(winner, why){
  S.over = true;
  S.phase = "finished";
  busy = true;
  S.turn = winner;
  S.winner = winner;
  S.why = why || "両手ともアウトで決着";
  S.step = null; S.pending = null;
  S.msg = `<b>${NAMES[winner]}</b>の勝ち。<span class="sub">${S.why}</span>`;
  closeAllPanels();
  stopTimer(); clearTimeout(watchdog);
  render();
  showWin();
  say(S.msg);
  commit();
}

function showWin(){
  const w = S.winner;
  if(w === null || w === undefined) return;
  /* 決着したら、手番の呼び出しも切断の警告も引っ込める */
  document.title = BASE_TITLE;
  wasMine = false;
  clearTimeout(goneTimer);
  renderGone();
  document.documentElement.style.setProperty("--turn-c", col(w));
  document.getElementById("winText").innerHTML =
    (online ? (w === seat ? "あなた" : NAMES[w]) : NAMES[w]) + "<br>の勝ち";
  document.getElementById("winWhy").textContent = S.why || "両手ともアウトで決着";
  document.getElementById("winAgain").textContent = online ? "もう一戦" : "最初から";
  document.getElementById("win").classList.add("open");
  if(!online || w === seat) SFX.win(); else SFX.lose();
}

boot();
</script>
